#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Kotlin/Native
# Compiler-cache build for ktor-client-darwin's iosSimulatorArm64 klib fails during framework
# linking on this toolchain (https://kotl.in/disable-native-cache is the documented workaround).
# iosArm64 (device) links fine and keeps its cache.
kotlin.native.cacheKind.iosSimulatorArm64=none